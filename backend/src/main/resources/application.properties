spring.application.name=backend
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Spring Boot 4 reads spring.mongodb.* (spring.data.mongodb.uri is ignored and
# falls back to localhost:27017).
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:taskis}

jwt.secret=${JWT_SECRET:7b4a2e8c6f3d9a1b4c7d0e5f2a8b9c3d4e6f1a7b8c2d5e3f4a9b6c8d7e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d}
jwt.expiration=${JWT_EXPIRATION:86400000}
