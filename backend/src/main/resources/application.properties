spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/taskis}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

jwt.secret=${JWT_SECRET:7b4a2e8c6f3d9a1b4c7d0e5f2a8b9c3d4e6f1a7b8c2d5e3f4a9b6c8d7e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d}
jwt.expiration=${JWT_EXPIRATION:86400000}
