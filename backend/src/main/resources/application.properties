spring.application.name=backend
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Spring Boot 4 reads spring.mongodb.* (spring.data.mongodb.uri is ignored and
# falls back to localhost:27017).
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:taskis}

jwt.secret=${JWT_SECRET:7b4a2e8c6f3d9a1b4c7d0e5f2a8b9c3d4e6f1a7b8c2d5e3f4a9b6c8d7e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Days a device stays signed in without use (renewed on every use).
taskis.refresh-days=${REFRESH_DAYS:90}

# Firebase service-account JSON (one line). Push notifications stay off until this is set.
taskis.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT:}

# LiveKit Cloud (voice and video calls). Calls stay off until all three are set.
livekit.url=${LIVEKIT_URL:}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}

# Desktop push (Web Push). Generate with scripts/generate-vapid-keys.sh. Stays off until both are set.
taskis.vapid.public-key=${VAPID_PUBLIC_KEY:}
taskis.vapid.private-key=${VAPID_PRIVATE_KEY:}
taskis.vapid.subject=${VAPID_SUBJECT:https://tasikisi.salynelson.rw}

# File storage. Without the S3_* values, files go to the server disk (lost on redeploy on hosts like Render).
# Cloudflare R2: S3_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com, S3_REGION=auto. See docs/FILE-STORAGE-SETUP.md.
taskis.storage.s3.endpoint=${S3_ENDPOINT:}
taskis.storage.s3.bucket=${S3_BUCKET:}
taskis.storage.s3.access-key=${S3_ACCESS_KEY:}
taskis.storage.s3.secret-key=${S3_SECRET_KEY:}
taskis.storage.s3.region=${S3_REGION:auto}
taskis.storage.local-dir=${UPLOAD_DIR:uploads}
