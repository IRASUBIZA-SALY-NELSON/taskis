name: Deploy Taskis

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Deploy
              run: |
                  cd /home/plp/taskis

                  echo "Pull latest code..."
                  git pull origin main

                  echo "Build frontend..."
                  cd frontend
                  npm install
                  npm run build

                  echo "Build backend..."
                  cd ../backend
                  chmod +x mvnw
                  ./mvnw clean package -DskipTests

                  echo "Restart backend..."
                  sudo -n systemctl restart taskis || echo "WARN: backend restart failed — configure passwordless sudo for 'systemctl restart taskis'"

                  echo "Restart frontend..."
                  cd /home/plp/taskis/frontend
                  if pm2 describe taskis-frontend > /dev/null 2>&1; then
                    pm2 restart taskis-frontend --update-env
                  else
                    pm2 start "npm run start" --name taskis-frontend
                  fi
                  pm2 save || true
