name: Deploy Taskis

on:
    push:
        branches:
            - main

# Avoid overlapping deploys stepping on each other.
concurrency:
    group: deploy-taskis
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Deploy
              run: |
                  set -e
                  cd /home/plp/taskis

                  echo "==> Pull latest code"
                  BEFORE=$(git rev-parse HEAD)
                  git fetch origin main
                  git reset --hard origin/main
                  AFTER=$(git rev-parse HEAD)
                  echo "Deploying ${BEFORE} -> ${AFTER}"

                  # Detect what changed so we only rebuild what we need.
                  CHANGED=$(git diff --name-only "${BEFORE}" "${AFTER}" || echo "all")
                  echo "Changed files:"; echo "${CHANGED:-<none>}"
                  FRONTEND_CHANGED=false
                  BACKEND_CHANGED=false
                  if [ "${BEFORE}" = "${AFTER}" ]; then echo "No new commits."; fi
                  if echo "$CHANGED" | grep -q '^frontend/' || [ "$CHANGED" = "all" ]; then FRONTEND_CHANGED=true; fi
                  if echo "$CHANGED" | grep -q '^backend/'  || [ "$CHANGED" = "all" ]; then BACKEND_CHANGED=true; fi

                  if [ "$FRONTEND_CHANGED" = "true" ]; then
                    echo "==> Build frontend"
                    cd /home/plp/taskis/frontend
                    npm ci --no-audit --no-fund
                    NEXT_TELEMETRY_DISABLED=1 npm run build
                  else
                    echo "==> Skipping frontend build (no frontend changes)"
                  fi

                  if [ "$BACKEND_CHANGED" = "true" ]; then
                    echo "==> Build backend"
                    cd /home/plp/taskis/backend
                    chmod +x mvnw
                    ./mvnw -q clean package -DskipTests
                  else
                    echo "==> Skipping backend build (no backend changes)"
                  fi

                  if [ "$BACKEND_CHANGED" = "true" ]; then
                    echo "==> Restart backend"
                    sudo -n systemctl restart taskis || echo "WARN: backend restart needs passwordless sudo for 'systemctl restart taskis'"
                  fi

                  if [ "$FRONTEND_CHANGED" = "true" ]; then
                    echo "==> Restart frontend"
                    # Stop the service first so systemd doesn't race with fuser
                    sudo -n systemctl stop taskis-frontend || true
                    # Kill anything still holding port 9091 (stale processes from previous runs)
                    sudo -n fuser -k 9091/tcp || true
                    # Give the OS time to release the port
                    sleep 2
                    # Start fresh
                    sudo -n systemctl start taskis-frontend
                    # Wait up to 15s for the port to come up
                    for i in $(seq 1 15); do
                      sudo -n ss -tulpn | grep -q ':9091' && echo "frontend up after ${i}s" && break
                      echo "  waiting... (${i}s)"
                      sleep 1
                    done
                  fi

                  echo "==> Health check"
                  # Wait up to 30s for frontend to serve HTTP
                  for i in $(seq 1 30); do
                    curl -fsS -o /dev/null "http://127.0.0.1:9091" && echo "frontend healthy after ${i}s" && break
                    sleep 1
                  done
                  curl -fsS -o /dev/null "http://127.0.0.1:8080/actuator/health" 2>/dev/null && echo "backend healthy" || true
                  echo "==> Done"
