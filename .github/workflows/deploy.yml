name: Deploy Taskis

on:
    push:
        branches:
            - main

jobs:
    deploy:
        runs-on: self-hosted

        steps:
            - name: Deploy
              run: |
                  cd /home/plp/taskis

                  echo "Pull latest code..."
                  git pull origin main

                  echo "Build frontend..."
                  cd frontend
                  npm install
                  npm run build

                  echo "Build backend..."
                  cd ../backend
                  chmod +x mvnw
                  ./mvnw clean package -DskipTests

                  echo "Restart backend..."
                  sudo systemctl restart taskis
